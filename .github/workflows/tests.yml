name: Package tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python scripts/build_docs.py --check
      - run: python -m pytest
      - run: python -m build
      - shell: bash
        run: python scripts/check_wheel.py dist/fnc_splus-*.whl
