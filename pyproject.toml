[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "FNC-Splus"
version = "0.1.1"
description = "Async and sync session-based Soroush Plus client with encrypted portable sessions"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
authors = [{name = "Hamidreza Bakhshi"}]
dependencies = [
  "splusthon==1.1.4",
  "aiohttp>=3.10,<4",
  "pycryptodome>=3.20,<5",
  "Pillow>=11,<14",
  "av>=14,<20",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<2", "ruff>=0.11,<1", "httpx>=0.27,<1"]
# Backward-compatible extra name; video support is installed by default.
video = []

[project.urls]
Repository = "https://github.com/HamidrezaBakhshi8118/FNC-Splus"

[project.scripts]
fnc-splus = "fnc_splus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fnc_splus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: explicitly enabled real-service integration tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
